name: Linting

on:
  push:

permissions: {}

jobs:
  actionlint:
    # Lints GitHub Actions workflow YAML files (.github/workflows/*.yml)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_brew
      - run: brew install actionlint
      - run: actionlint -color

  checkmake:
    # Lints Makefile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_go
      - run: go install github.com/checkmake/checkmake/cmd/checkmake@59931d556f8f5cf4fbacf2c8390a8122ef7a881d # v0.3.2
      - name: Run checkmake
        run: |
          "$(go env GOPATH)/bin/checkmake" Makefile

  editorconfig-checker:
    # Lints all files against .editorconfig
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_brew
      - run: brew install editorconfig-checker
      - run: editorconfig-checker

  json:
    # Lints JSON and JSONC files (*.json, .*.json, *.jsonc, .*.jsonc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_jq
      - name: Run jq
        run: |
          find . \( -iname ".*.json" -or -iname "*.json" -or -iname ".*.jsonc" -or -iname "*.jsonc" \) -exec echo "{}" \; -exec sh -c jq . "$1" \;

  markdownlint:
    # Lints Markdown files (*.md)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
      - name: Install packages
        run: npm install
      - name: Run markdownlint-cli2
        run: npm exec markdownlint-cli2 -- **.md

  markdown-link-check:
    # Checks links in Markdown files (*.md)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
      - name: Install packages
        run: npm install
      - name: Run markdown-link-check
        run: npm exec markdown-link-check -- *.md

  plutil:
    # Lints macOS plist files (*.plist)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_plutil
      - run: plutil -- *.plist

  shellcheck:
    # Lints shell scripts (bin/*, git_template/hooks/*, bash_aliases, *.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_shellcheck
      - run: shellcheck --severity=warning -- bin/* git_template/hooks/* bash_aliases *.sh

  shfmt:
    # Formats shell scripts (bin/*, git_template/hooks/*, bash_aliases, *.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_go
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@2f3f5e36d9b0f8f14c998d50aa20a28832205ae8 # v3.13.1
      - name: "Run shfmt"
        run: |
          "$(go env GOPATH)/bin/shfmt" --diff -- bin/* git_template/hooks/* bash_aliases *.sh

  skills-lint:
    # Lints skill definitions under agents/skills and .agents/skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
      - name: Cache token counts
        id: token-counts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .skills-lint-cache/tokens.json
          key: token-counts
      - name: Install packages
        run: npm install
      - name: Run skills-lint
        run: npm exec skills-lint --quiet

  zsh-lint:
    # Lints zsh scripts (*.zsh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make installed_go
      - run: go install github.com/z-shell/zsh-lint/cmd/zsh-lint@33bce8041faa1395455562c5a558a063ccdcc441 # v1.2.0
      - name: "Run zsh-lint"
        run: |
          "$(go env GOPATH)/bin/zsh-lint" ./*.zsh
